name: Build all

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        
        cache: maven
    - name: Build with Maven
      run: ls -l ; cat settings.xml ; mvn -B -U -s settings.xml install -DskipTests
      env:
        # The default GITHUB_TOKEN can only read packages published by this
        # repository. The build also depends on packages from
        # taranion/Babylon_LicenseCheck, so a personal access token with
        # "read:packages" scope (and access to that repository) must be
        # stored in the PACKAGES_TOKEN repository secret.
        GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}


    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      if: github.event_name == 'push'
      uses: advanced-security/maven-dependency-submission-action@v6
      with:
        settings-file: settings.xml
        token: ${{ github.token }}
      env:
        GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
