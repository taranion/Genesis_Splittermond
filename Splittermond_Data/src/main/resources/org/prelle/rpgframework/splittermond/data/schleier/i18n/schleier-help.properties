education.spiritist.descr=Spiritisten vermitteln zwischen Lebenden und Geistern. Ihre Ausbildung verbindet Kenntnisse über Geister mit Todes-, Bann- und Schutzmagie.
education.mistcrow.descr=Nyrdfingische Geisterabwehr im Dienst der Starrekyngkirche. Ein Ressourcenpunkt ist für den Rang in dieser Kirche vorgesehen.
education.whispershadow.descr=Geisterkundige aus Piriwatu, Puntani oder Utarti mit Heil- und Naturmagie. Ein Ressourcenpunkt ist für den Rang bei den Flüsterschatten vorgesehen.
education.ancestorcarrier.descr=Spiritisten aus Sadu oder Zhoujiang, die Ahnenwissen bewahren und ihren Körper als Gefäß für Geister einsetzen können.
education.zhoujiang_exorcist.descr=Auf Geisterabwehr spezialisierte Mystische Krieger aus Zhoujiang. Bei der Wahl eines Rangs gehört dieser zur Kirche der Wugei, des Jausei oder der Gagamba.
education.obsidianseeker.descr=Zwergische Wissenspriester aus Borombri oder Furgand, die mithilfe der Geisterwelt nach verlorenen Obsidiantafeln suchen. Ihr Rang gehört zu den Obsidiansuchern.
education.otherworld_emissary.descr=Beschwörer im Dienst eines Ortsgeistes. Sie schützen dessen diesseitigen Anker und werden von einem Geistervertrauten begleitet.
mastership.deathmagic.medium1.desc=Gelingt die Aktive Abwehr gegen einen Besessenheitsangriff, kommen 2 Erfolgsgrade zum Abwehrergebnis hinzu. Der Vorteil gilt nur für diese Abwehr, nicht als dauerhafter Widerstandsbonus.
material.ghostiron.desc=Seltenes Metall für Waffen und Rüstungen, das seine besonderen Möglichkeiten beim Wechsel in die Geisterwelt entfaltet.
material.ghostiron.effect=Für Waffen und Rüstungen. Härte um 2 vermindern, mindestens auf 1. Beim Übergang in die Geisterwelt bleiben Eigenschaften und Fähigkeiten wie bei einem Relikt erhalten; Waffen verwenden ihre üblichen Fertigkeiten und Schadenswerte, Rüstungs-SR ergänzt die natürliche SR der Geistergestalt. Die Sonderregeln zum Übergang in die Geisterwelt werden nicht automatisch berechnet.
material.maidh_bewerdu_feathers.desc=Federn der Mutter der Rabentöchter als besonderes Material für Schmuck. Sie sind nicht im freien Handel erhältlich. Ursprüngliche Quelle: Jenseits der Grenzen, S. 126; Ergänzungen in Hinter dem Schleier.
material.maidh_bewerdu_feathers.effect=Todesmagie +2; nur ein Gegenstand gewährt diesen Materialbonus. Ein erfolgreiches Ende des Weges wirkt verstärkt, ohne dafür zusätzliche EG oder Fokus einzusetzen. Geistreise kann bis zu fünf weitere Personen einschließen; je zusätzlicher Person steigen die Kosten um K2V1. Die Zaubersonderwirkungen werden nicht automatisch angewendet. Kein Marktpreis.
material.maidh_bewerdu_feathers.effect.short=Kein Marktpreis. Ende des Weges bei Erfolg ohne Verstärkungsmehrkosten verstärkt; Geistreise für bis zu 5 weitere Personen zu je K2V1. Nur ein Gegenstand gewährt den Materialbonus.
item.akherat_glass.desc=Strukturgeber mit Zauberverankerung für Geisterblick. In der Geisterwelt gilt für visuelle Wahrnehmung ein situativer Bonus von 2; kein dauerhafter Wahrnehmungsbonus. Schwerpunkt: Geisterwelt.
item.akherat_glass_improved.desc=Verbesserter Strukturgeber mit Zauberverankerung für Geisterblick. In der Geisterwelt gilt für visuelle Wahrnehmung ein situativer Bonus von 2; kein dauerhafter Wahrnehmungsbonus. Schwerpunkt: Geisterwelt.
item.prayer_wheel.desc=Hilfsmittel für Redegewandtheit oder Diplomatie mit dem Schwerpunkt Geisterwesen. Die passende Fertigkeit richtet sich nach der Anwendung.
item.ghost_lights.desc=Kerzen aus Seelenwachs mit 30 Minuten Brenndauer. Ihr Licht senkt die Lichtstufe im Umkreis von 3 Metern um 1. Schatten zeigen die Anzahl anwesender Geisterwesen in diesem Bereich der Geisterwelt, auch bei Unsichtbarkeit oder Verbergung, aber nicht deren Art. In der Geisterwelt selbst wirken sie wie gewöhnliche Kerzen. Situative Anwendung ohne automatische Berechnung.

mastership.arcanelore.spiritlore1.desc=Gegenüber Geisterwesen: +2 auf Entschlossenheit, Wahrnehmung und Zähigkeit. Für Wissen über Geisterwelt und Bewohner: +2 auf Geschichte und Mythen.
mastership.arcanelore.spiritlore2.desc=In den Anwendungsfällen von Geisterkunde I gilt nun +4 statt +2.
mastership.diplomacy.spiritdiplomat.desc=Bei Verhandlungen mit Geisterwesen wird deren Einstellung zur Bestimmung der Schwierigkeit um eine Stufe günstiger gewertet; höchstens hilfsbereit.
mastership.empathy.spiritempathy1.desc=Bei Interaktionen mit Geisterwesen erhalten Anführen, Empathie, Diplomatie und Redegewandtheit jeweils +2.
mastership.empathy.spiritempathy2.desc=Der situationsgebundene Bonus von Geistergespür I beträgt nun +4.
mastership.empathy.spiritworldsense1.desc=Orientierung und Zeitschätzung in der spirituellen Domäne erhalten einen Probenbonus von +3.
mastership.empathy.spiritworldsense2.desc=Für Orientierung und Zeitschätzung in der spirituellen Domäne gilt +6 statt +3. Richtung und Entfernung zum eigenen Eintrittsort lassen sich dort erspüren.
mastership.determination.steadfastsoul1.desc=Proben zur Abwehr des Übergangsschocks erhalten +3.
mastership.determination.steadfastsoul2.desc=Bis zu drei Punkte an Mali aus Übergangsschock oder Erschaudert bleiben unberücksichtigt.
mastership.determination.undaunted.desc=Nur gegenüber Schauderangriffen liegt der Geistige Widerstand um 3 höher.
mastership.determination.willform.desc=In der Geisterwelt lässt sich das eigene Erscheinungsbild geringfügig verändern: +4 auf Redegewandtheit beim Behaupten der eigenen Identität sowie auf Heimlichkeit, wenn die Herkunft aus dem Diesseits verborgen werden soll.
mastership.determination.willweapon.desc=Beim Kämpfen mit dem Geistkörper in der spirituellen Domäne wird die volle Willenskraft als Schadensbonus verwendet; die Waffengeschwindigkeit sinkt um 1.
mastership.determination.willarmor.desc=Für die natürliche Schadensreduktion des Geistkörpers zählt der höhere Wert aus Verstand und Willenskraft.
mastership.perception.apartbutunited.desc=Während der Geistreise werden Verletzungen des zurückgelassenen Körpers bemerkt. Mit einer kontinuierlichen Aktion von 15 Ticks, 3V1 Fokus und Entschlossenheit gegen 25 ist ein kurzer Blick durch dessen Augen möglich.
mastership.deathmagic.powerofwill1.desc=In der spirituellen Domäne entfallen Erkenntnisproben, um Brennend und Sterbend durch Ersticken als ungefährlich für das eigene Abbild zu durchschauen. Gegen Schauderangriffe gilt außerdem GW +1.
mastership.deathmagic.powerofwill2.desc=In der spirituellen Domäne ist Flug möglich; die Fluggeschwindigkeit entspricht der Willenskraft.
mastership.deathmagic.powerofwill3.desc=Der Geistkörper kann in der spirituellen Domäne durch Wände hindurchgehen.
mastership.deathmagic.medium2.desc=Eine erfolgreiche Aktive Abwehr gegen Besessenheit liefert nochmals zwei zusätzliche EG; zusammen mit Medium I sind es vier.
mastership.deathmagic.onewithbeyond.desc=Jenseitige Wesen einschließlich der Wächter erkennen den Zauberer als zugehörig an und lassen ihn unbehelligt passieren. Übergangsschock und Schauder wirken nicht auf ihn.
mastership.combatmagic.spiritfoe_dead.desc=Angriffe gegen Totengeister erhalten +2. In der spirituellen Domäne richtet der Geistkörper gegen diese Geisterart zusätzlich 2 Punkte Waffenschaden an. Andere Geisterarten können mit getrennten Käufen dieser Meisterschaft gewählt werden.
mastership.combatmagic.spiritfoe_nature.desc=Angriffe gegen Naturgeister erhalten +2. In der spirituellen Domäne richtet der Geistkörper gegen diese Geisterart zusätzlich 2 Punkte Waffenschaden an. Andere Geisterarten können mit getrennten Käufen dieser Meisterschaft gewählt werden.
mastership.combatmagic.spiritfoe_civilization.desc=Angriffe gegen Zivilisationsgeister erhalten +2. In der spirituellen Domäne richtet der Geistkörper gegen diese Geisterart zusätzlich 2 Punkte Waffenschaden an. Andere Geisterarten können mit getrennten Käufen dieser Meisterschaft gewählt werden.
power.oldsoul.desc=Erinnerungen an ein früheres Leben werden mit der Spielleitung festgelegt. Ein Splitterpunkt und eine gelungene Probe auf Entschlossenheit oder Wahrnehmung gegen 15 ermöglichen gezielten Zugriff: entweder eine passende Information oder +1 zuzüglich der erzielten EG auf die nächste dazu passende Probe.
spell.forced_return.descr=Ziel ist ein Geistreisender: berührt werden kann sein Geistkörper im Jenseits oder sein Körper im Diesseits. Die Seele legt bis zu 100 km in Richtung ihres Körpers zurück. Erreicht sie ihn, endet die Geistreise und Benommen 5 tritt ein; andernfalls bleibt sie am erreichten jenseitigen Ort.
spell.forced_return.enhancedescr=Die Rückholstrecke beträgt bis zu 500 km; Benommen tritt nicht ein.
spell.sense_foreign_control.descr=Zeigt an, ob das Ziel besessen ist oder unter einem Zauber des Typus Kontrolle steht.
spell.sense_foreign_control.enhancedescr=Zusätzlich wird der Zaubergrad beziehungsweise der Einzelwesen-Monstergrad der besitzergreifenden Wesenheit erkannt.
spell.sense_spirit_anchor.descr=Bei Geisterwesen im Umkreis wird die Art ihrer diesseitigen Bindung erkennbar, etwa Herzensangelegenheit, Ahnenverehrung, physischer Anker oder Doppelseele.
spell.sense_spirit_anchor.enhancedescr=Die jeweiligen Anker werden inhaltlich genauer erfasst.
spell.spirit_mimicry.descr=Verleiht das Aussehen eines Totengeistes und Körperlos, sodass auch schmale Ritzen passierbar sind. Einschüchtern erhält einen leicht positiven Umstand. Die Geschwindigkeit beträgt MYS +5. Mitverwandelte Kleidung und Ausrüstung verlieren ihre Werte entsprechend den Geisterweltregeln. Im Jenseits halten Geister den Verwandelten für einen echten Geist.
spell.spirit_mimicry.enhancedescr=Mitverwandelte Gegenstände behalten ihre Spielwerte.
spell.spirit_wall.descr=Erschafft eine gerade, ortsfeste Wand aus Geisterfratzen: 20 cm dick, bis zu 10 m² Fläche frei aufteilbar. Beim Durchqueren ist Entschlossenheit gegen 25 nötig; ein Fehlschlag verursacht Angsterfüllt. Die übliche maximale Wirkungsweite für kanalisierte Zauber ist verzehnfacht.
spell.spirit_wall.enhancedescr=Die Entschlossenheit-Probe wird gegen 30 abgelegt.
spell.message_from_beyond.descr=Ritus. Ein Geistreisender sendet höchstens 100 Worte an eine Person im Diesseits. Ihr Name muss bekannt sein, eine persönliche Begegnung ist unnötig. Die empfangene Gedankenbotschaft klingt wie die Stimme des Absenders.
spell.message_from_beyond.enhancedescr=Statt eines Namens genügt eine eindeutige Eingrenzung des Empfängers, beispielsweise die dem zurückgelassenen Körper nächste Person.
spell.otherworld_flame.descr=Eine kalte grünliche Flamme brennt am Zielort zugleich im Diesseits und an dessen jenseitiger Entsprechung. Sie verbessert die Lichtverhältnisse im Wirkungsbereich um eine Stufe.
spell.otherworld_flame.enhancedescr=Nahe Geisterwesen werden angelockt und versammeln sich um die Flamme.
spell.sever_spirit_bond.descr=Ritus. Trennt dauerhaft die Verbindung eines Totengeistes im Jenseits zum Diesseits; Geistreisende sind keine zulässigen Ziele. Der Geist kann weder selbst hinüberwechseln noch vom Diesseits aus gerufen oder beschworen werden. Ohne bisheriges Verblasst erhält er Verblasst 1.
spell.sever_spirit_bond.enhancedescr=Verblasst steigt gegenüber der Grundwirkung um eine weitere Stufe. Ein Geist, der zuvor bereits Verblasst 3 besaß, löst sich auf.
spell.invisible_to_spirits.descr=Geisterwesen beider Domänen nehmen den Zauberer nicht wahr, sofern ihr GW unter 15 plus seinen Fertigkeitspunkten in der verwendeten Magieschule liegt. Greift er ein solches Wesen an, kann dieses ihn sofort wieder wahrnehmen.
spell.invisible_to_spirits.enhancedescr=Nach einem Angriff vergehen 10 Ticks, bevor das angegriffene Wesen den Zauberer wahrnehmen kann.
item.nurghons_breath.desc=Für Kontaktaufnahme zur Geisterwelt oder einen Übertritt gilt ein leicht positiver Umstand. Pflanzenschwierigkeit: 20. Last und Härte sind im Buch nicht festgelegt; hier gilt der Katalogstandard 0.
item.huularu_mango.desc=Vergorene Mango: Ein leicht positiver Umstand unterstützt Proben für Geisterweltkontakt und Übertritt. Pflanzenschwierigkeit: 15. Last und Härte sind im Buch nicht festgelegt; hier gilt der Katalogstandard 0.
item.veil_moss.desc=Nach sechs Stunden im Jenseits und Entschlossenheit gegen 30 übernimmt das Moos für drei Tage die alchemistischen Eigenschaften einer gewählten lorakischen Pflanze. Pflanzenschwierigkeit: 15. Last und Härte sind im Buch nicht festgelegt; hier gilt der Katalogstandard 0.
item.spirit_lily.desc=Der Duft jenseitiger Lilien verbessert die Einstellung vieler Geisterwesen um eine Stufe, höchstens bis aufgeschlossen. Pflanzenschwierigkeit: 25. Last und Härte sind im Buch nicht festgelegt; hier gilt der Katalogstandard 0.
item.sedative.desc=Beendet den Zustand Angsterfüllt. Qualitätskosten der Wirkung: 2; Gegenstandsqualität bei Standardherstellung: 1. Last und Härte: Katalogstandard 0 mangels Buchangabe.
item.strong_sedative.desc=Beendet den Zustand Panisch. Qualitätskosten der Wirkung: 3; Gegenstandsqualität bei Standardherstellung: 2. Last und Härte: Katalogstandard 0 mangels Buchangabe.
item.dream_resin.desc=Die Schwierigkeit der Entschlossenheit-Probe gegen Übergangsschock sinkt um 5. Qualitätskosten der Wirkung: 3; Gegenstandsqualität bei Standardherstellung: 2. Last und Härte: Katalogstandard 0 mangels Buchangabe.
item.pale_lily_extract.desc=Äußerlich aufgetragen zieht der Duft Geisterwesen verstärkt zum behandelten Wesen oder Gegenstand und versetzt sie in Rasend. Verschluckt wirkt der Extrakt als Gift: Einnahme 1; Erschöpft 1; Dauer eine Stunde. Qualitätskosten der Wirkung: 3; Gegenstandsqualität bei Standardherstellung: 2. Last und Härte: Katalogstandard 0 mangels Buchangabe.
item.spirit_incense.desc=Die gewählte Räuchersubstanz bewirkt +2 oder −2 bei Geisterbeschwörungen und Besessenheitsangriffen. Welche Richtung gilt, hängt von der Substanz ab. Keine Qualitätskosten angegeben. Last und Härte: Katalogstandard 0 mangels Buchangabe.
item.soul_wax.desc=Aufbereitete Geistersubstanz zur Fertigung von Jenseitsinstrumenten und weiteren Artefakten. Qualitätskosten der Wirkung: 2; Gegenstandsqualität bei Standardherstellung: 1. Last und Härte: Katalogstandard 0 mangels Buchangabe.
item.book_spirit_travel.desc=Fachbuch: +2 auf die Schwerpunkte Geisterwesen und Geisterwelt bei Arkane Kunde.
item.book_spirit_summon_banish.desc=Fachbuch: +2 auf Zauber mit Typus Beschwörung oder Wesen bannen bei Todesmagie.
item.book_spirit_almanac.desc=Fachbuch: +2 auf Zauber des Typus Geisterwesen bei Todesmagie.
item.book_zhelom_travels.desc=Fachbuch: +2 auf den Schwerpunkt Untergegangene Kulturen bei Geschichte und Mythen.
item.portable_spirit_circle.desc=Artefaktvorlage für Bannkreis gegen Geisterwesen: Strukturgeber. Strukturgeber enthalten eine Zauberverankerung. Verfügbarkeit, Last und Härte sind nicht angegeben; Werte bei konkreter Ausführung festlegen.
item.portable_spirit_circle_improved.desc=Artefaktvorlage für Bannkreis gegen Geisterwesen: verbesserter Strukturgeber. Strukturgeber enthalten eine Zauberverankerung. Verfügbarkeit, Last und Härte sind nicht angegeben; Werte bei konkreter Ausführung festlegen.
item.portable_spirit_circle_charged.desc=Artefaktvorlage für Bannkreis gegen Geisterwesen: Zauberspeicher, 3 Ladungen. Strukturgeber enthalten eine Zauberverankerung. Verfügbarkeit, Last und Härte sind nicht angegeben; Werte bei konkreter Ausführung festlegen.
item.spirit_salt_circle.desc=Schriftrolle mit Bannkreis gegen Geisterwesen. Verfügbarkeit, Last und Härte sind nicht angegeben; Werte bei konkreter Ausführung festlegen.
item.spirit_salt_circle_improved.desc=Verbesserte Schriftrolle mit Bannkreis gegen Geisterwesen. Verfügbarkeit, Last und Härte sind nicht angegeben; Werte bei konkreter Ausführung festlegen.
item.spirit_salt_shield.desc=Schriftrolle mit Geisterschild. Verfügbarkeit, Last und Härte sind nicht angegeben; Werte bei konkreter Ausführung festlegen.
item.spirit_salt_shield_improved.desc=Verbesserte Schriftrolle mit Geisterschild. Verfügbarkeit, Last und Härte sind nicht angegeben; Werte bei konkreter Ausführung festlegen.
item.spirit_salt_close.desc=Schriftrolle mit Übergang verschließen. Verfügbarkeit, Last und Härte sind nicht angegeben; Werte bei konkreter Ausführung festlegen.
item.spirit_salt_close_improved.desc=Verbesserte Schriftrolle mit Übergang verschließen. Verfügbarkeit, Last und Härte sind nicht angegeben; Werte bei konkreter Ausführung festlegen.
